name: Actualizar capturas del perfil

on:
  schedule:
    - cron: "0 12 * * 1"   # lunes 12:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["datos/centro.json"]

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # bidig bloquea las IP de GitHub: aquí solo se actualizan el tablero y el banner
      - run: npm run capturar
        env:
          CAPTURAR_BIDIG: "0"
      - run: npm run generar
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile datos
          git diff --cached --quiet || git commit -m "Actualiza capturas, cifras y README del perfil"
          git push
